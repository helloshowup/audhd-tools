<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Padkleur Paper Ground -->
  <rect width="64" height="64" fill="#EFECE3"/>
  <!-- Ink 2px Outer Border -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#16130F" stroke-width="2"/>

  <!-- Jaunty Tilted Top Hat (-6 deg) -->
  <g transform="rotate(-6 32 20)">
    <!-- Crown -->
    <rect x="21" y="6" width="22" height="17" fill="#16130F"/>
    <!-- Gold Silk Band -->
    <rect x="21" y="19" width="22" height="4" fill="#E7B21B"/>
    <!-- Brim -->
    <rect x="13" y="23" width="38" height="3.5" fill="#16130F"/>
  </g>

  <!-- Left Eye: Aristocratic Squint -->
  <rect x="18" y="32" width="10" height="3" fill="#16130F"/>
  <rect x="20" y="37" width="5" height="3" fill="#16130F"/>

  <!-- Right Eye: The Grand Gold Monocle -->
  <rect x="33" y="30" width="14" height="14" fill="#E7B21B"/>
  <rect x="35.5" y="32.5" width="9" height="9" fill="#EFECE3"/>
  <!-- Cyan Light Sheen -->
  <polygon points="40,32.5 43,32.5 37.5,41.5 35.5,41.5" fill="#59CBE8"/>
  <!-- Monocle Lug -->
  <rect x="47" y="35" width="2" height="4" fill="#E7B21B"/>
  <!-- Stepped Chain with clean clearance from mustache -->
  <path d="M49,38 L54,38 L54,47 L52,47 L52,56" fill="none" stroke="#E7B21B" stroke-width="1.5"/>
  <rect x="50.5" y="55" width="4" height="4" fill="#E7B21B"/>

  <!-- The Imperial Neo-Brutalist Handlebar Mustache -->
  <rect x="26" y="44" width="10" height="4" fill="#16130F"/>
  <polygon points="26,44 26,48 17,48 12,43 12,39 16,39 20,44" fill="#16130F"/>
  <polygon points="36,44 36,48 45,48 50,43 50,39 46,39 42,44" fill="#16130F"/>

  <!-- Collar & Bow Tie -->
  <polygon points="26,53 36,53 33,56 29,56" fill="#DDD9C3"/>
  <polygon points="25,55 37,55 35,59 27,59" fill="#16130F"/>
  <rect x="29.5" y="55" width="3" height="3" fill="#E7B21B"/>
</svg>